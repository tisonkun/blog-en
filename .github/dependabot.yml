version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      expressive-code:
        patterns:
          - "astro-expressive-code"
          - "@expressive-code/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
